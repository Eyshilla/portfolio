<style>
/* Layout: ficha da personagem + menu à esquerda, caixa de conteúdo NES à direita; no celular tudo empilha */
:root {
  --night: #2a1244;
  --orchid: #a64fd0;
  --orchid-deep: #5e2a8a;
  --pink: #ff9ecf;
  --pink-soft: #ffdaec;
  --pink-deep: #e8579f;
  --lime: #c6f23c;
  --lime-deep: #9bc41f;
  --ink: #2a1244;
  --white: #ffffff;
  --px: 'Press Start 2P', ui-monospace, monospace;
  --body: 'VT323', ui-monospace, monospace;
  --frame: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding-block: 28px 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  font-family: var(--body);
  font-size: 22px;
  line-height: 1.25;
  background-color: var(--pink-soft);
  background-image: radial-gradient(rgba(166,79,208,.16) 2px, transparent 2px);
  background-size: 20px 20px;
  color: var(--ink);
}
h1, h2, h3, p, dl, dd { margin: 0; }
canvas { image-rendering: pixelated; display: block; }
:focus-visible { outline: 3px dashed var(--orchid-deep); outline-offset: 4px; }

.wrap { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 36px 32px; align-items: start; }
.side { display: grid; gap: 32px; min-width: 0; }

/* caixa NES */
.box { position: relative; min-width: 0; background: var(--white); box-shadow: var(--frame); margin: 4px; padding: 22px 20px 18px; }
.box > .ti { position: absolute; top: -17px; left: 12px; background: var(--white); padding: 0 8px; font-family: var(--px); font-size: 10px; line-height: 1.4; color: var(--orchid-deep); }

/* ficha */
.sbox { background: var(--night); padding: 12px; display: inline-block; box-shadow: var(--frame); margin: 4px; }
.name { font-family: var(--px); font-size: 15px; line-height: 1.3; margin: 16px 0 6px; overflow-wrap: anywhere; color: var(--orchid-deep); }
.class { font-size: 22px; margin-bottom: 14px; }
.ficha { display: grid; gap: 10px; }
.ficha div { border-top: 3px dotted var(--orchid); padding-top: 8px; }
.ficha dt { font-family: var(--px); font-size: 8px; line-height: 1.4; color: var(--pink-deep); margin-bottom: 5px; }
.ficha dd { font-size: 21px; }

/* menu */
.menu { display: grid; gap: 14px; }
.mi {
  position: relative; text-align: left; width: 100%; cursor: pointer; border: 0; margin: 0;
  font-family: var(--px); font-size: 11px; line-height: 1.4; color: var(--ink);
  padding: 14px 12px 14px 32px; background: var(--pink);
  box-shadow: var(--frame), inset -4px -4px 0 0 var(--pink-deep);
}
.mi:hover { filter: brightness(1.06); }
.mi:active { transform: translateY(3px); }
.mi[aria-selected="true"] { background: var(--lime); box-shadow: var(--frame), inset -4px -4px 0 0 var(--lime-deep); }
.mi[aria-selected="true"]::before { content: ""; position: absolute; left: 11px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 9px solid var(--ink); border-right: 0; }

/* conteúdo */
.main { display: grid; gap: 40px; }
.main h2 { font-family: var(--px); font-size: 14px; line-height: 1.5; color: var(--orchid-deep); margin-bottom: 14px; }
.main p + p { margin-top: 12px; }
.lead { font-size: 26px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 40px 26px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
li { padding-left: 24px; position: relative; }
li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 10px; height: 10px; background: var(--orchid); box-shadow: 3px 3px 0 var(--pink); }
li b { display: block; font-weight: 400; }
li span { color: var(--orchid-deep); font-size: 20px; }
.tag { display: inline-block; font-family: var(--px); font-size: 8px; line-height: 1.4; padding: 6px 7px; margin: 0 8px 8px 2px; background: var(--lime); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.box h3 { font-family: var(--px); font-size: 11px; line-height: 1.5; color: var(--orchid-deep); margin-bottom: 10px; }
.sec { font-family: var(--px); font-size: 11px; line-height: 1.4; display: inline-block; background: var(--pink); padding: 9px 11px; margin-bottom: 30px; box-shadow: 4px 4px 0 var(--ink); }
.quest small { display: block; font-family: var(--px); font-size: 8px; color: var(--pink-deep); margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 16px; margin-top: 20px; }
.stat { background: var(--pink-soft); padding: 10px 12px; box-shadow: 0 0 0 3px var(--ink); }
.stat small { display: block; font-family: var(--px); font-size: 8px; color: var(--orchid-deep); margin-bottom: 7px; }
.hint { font-size: 20px; opacity: .8; max-width: 60ch; }
.hint:empty { display: none; }
.meta { font-size: 20px; color: var(--orchid-deep); margin-bottom: 10px; }
.modelo { opacity: .7; }
.thumb { display: flex; align-items: center; justify-content: center; aspect-ratio: 7 / 5; overflow: hidden; margin: 3px 3px 18px; background: var(--pink-soft); box-shadow: 0 0 0 3px var(--ink); color: var(--orchid-deep); text-decoration: none; text-align: center; }
a.thumb:hover { filter: brightness(1.05); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.thumb-vazio { font-family: var(--px); font-size: 8px; line-height: 1.6; padding: 12px; border: 3px dashed var(--orchid); margin: 10px; }
.ficon { width: 64px; height: auto; }
.ficon .pg { fill: var(--pink); stroke: var(--ink); stroke-width: 3; }
.ficon .dobra { fill: none; stroke: var(--ink); stroke-width: 3; }
.ficon .rot { fill: var(--lime); stroke: var(--ink); stroke-width: 2; }
.ficon text { fill: var(--ink); font-family: var(--px); }
.intro { font-size: 24px; margin-bottom: 26px; max-width: 60ch; }

.lnk { display: inline-block; margin: 4px 8px 4px 2px; padding: 10px 12px; font-family: var(--px); font-size: 9px; line-height: 1.4; color: var(--ink); background: var(--pink); text-decoration: none; box-shadow: var(--frame); }
a.lnk:hover { background: var(--lime); }
.lnk.empty { background: transparent; box-shadow: none; border: 3px dashed var(--orchid); color: var(--orchid-deep); }
.contatos { display: grid; gap: 6px; }
@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .menu { grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }

.status { max-width: 1000px; margin: 40px auto 0; font-size: 18px; opacity: .7; }
.carregando { font-family: var(--px); font-size: 11px; color: var(--orchid-deep); padding: 8px 4px; }
</style>

/* ============ DAQUI PARA BAIXO NÃO PRECISA MEXER ============ */
const VAZIO = { tipo: '', titulo: '', detalhe: '', descricao: '', tags: '', link: '', arquivo: '', miniatura: '', mostrar: '' };
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (/^(https?:|mailto:)/i.test(u)) return u; return /^[a-z][a-z0-9+.-]*:/i.test(u) ? '' : u; };
const caminho = (v) => { v = String(v || '').trim(); if (!v) return ''; if (/^https?:/i.test(v)) return v; v = v.replace(/^\/+/, ''); return encodeURI(v.startsWith(PASTA) ? v : PASTA + v); };
const ext = u => String(u || '').split(/[?#]/)[0].split('.').pop().toLowerCase();
const isImg = u => ['png', 'jpg', 'jpeg', 'webp', 'gif', 'avif'].includes(ext(u));
const rotuloDe = u => ext(u) === 'pdf' ? 'PDF' : (isImg(u) ? 'IMG' : 'LINK');
const tags = a => a.map(t => `<span class="tag">${esc(t)}</span>`).join('');
const slot = (url, label) => url ? `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ▶</a>` : '';
const lista = (list, card) => list.length ? list.map(card).join('') : '<div class="box"><p>Em breve.</p></div>';

/* CSV */
function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ''; rows.push(r); r = []; }
    else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); rows.push(r); }
  return rows;
}
function lerLinhas(tabela) {
  if (!tabela.length) return [];
  const cab = tabela[0].map(norm), idx = {};
  Object.keys(VAZIO).forEach(k => { idx[k] = cab.indexOf(k); });
  if (idx.tipo < 0) throw new Error('coluna "tipo" não encontrada');
  return tabela.slice(1).map(l => { const o = {}; Object.keys(VAZIO).forEach(k => { o[k] = idx[k] >= 0 ? (l[idx[k]] || '') : ''; }); return o; }).filter(o => norm(o.tipo));
}

/* modelo */
let M = null;
function montar(linhas) {
  const m = { nome: '', classe: '', ficha: [], sobre: [], destaques: [], cv: { formacao: [], experiencia: [], programa: [], ferramenta: [] }, analises: [], projCursos: [], certs: [], emCurso: [], sugestoes: [], sugIntro: '', contatos: [] };
  const lst = s => String(s).split(';').map(x => x.trim()).filter(Boolean);
  linhas.map(r => Object.assign({}, VAZIO, r)).filter(r => !['nao', 'n', '0', 'false', 'no'].includes(norm(r.mostrar))).forEach(r => {
    const tipo = norm(r.tipo);
    const link = safeUrl(r.link) || caminho(r.arquivo);
    switch (tipo) {
      case 'perfil': m.nome = r.titulo; m.classe = r.detalhe; break;
      case 'ficha': m.ficha.push([r.titulo, r.detalhe]); break;
      case 'sobre': m.sobre.push(r.descricao); break;
      case 'destaque': m.destaques.push([r.titulo, r.detalhe]); break;
      case 'formacao': case 'experiencia': case 'programa': m.cv[tipo].push({ t: r.titulo, s: r.detalhe }); break;
      case 'ferramenta': m.cv.ferramenta.push(r.titulo); break;
      case 'analise': m.analises.push({ t: r.titulo, d: r.descricao, tags: lst(r.tags), link: safeUrl(r.link) }); break;
      case 'projeto_curso': m.projCursos.push({ t: r.titulo, d: r.descricao, tags: lst(r.tags), link: safeUrl(r.link) }); break;
      case 'certificado': m.certs.push({ t: r.titulo, d: r.detalhe, tags: lst(r.tags), link, img: caminho(r.miniatura) }); break;
      case 'em_andamento': m.emCurso.push({ t: r.titulo, d: r.detalhe, tags: lst(r.tags) }); break;
      case 'sugestao': m.sugestoes.push({ t: r.titulo, d: r.detalhe, por: r.descricao, tags: lst(r.tags), link: safeUrl(r.link) }); break;
      case 'intro_sugestoes': m.sugIntro = r.descricao; break;
      case 'contato': m.contatos.push({ label: r.titulo, url: safeUrl(r.link) }); break;
    }
  });
  return m;
}

const projCard = label => p => `<div class="box quest"><small>${label}</small><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p><div style="margin-top:14px">${tags(p.tags)}</div><div style="margin-top:6px">${slot(p.link, 'VER NO GITHUB')}</div></div>`;

const VIEWS = {
  sobre: () => `<div class="box"><span class="ti">Sobre mim</span>${M.sobre.length ? `<p class="lead">${esc(M.sobre[0])}</p>${M.sobre.slice(1).map(t => `<p>${esc(t)}</p>`).join('')}` : '<p>Em breve.</p>'}${M.destaques.length ? `<div class="stats">${M.destaques.map(s => `<div class="stat"><small>${esc(s[0])}</small>${esc(s[1])}</div>`).join('')}</div>` : ''}</div>`,
  curriculo: () => {
    const grupos = [['Formação', 'formacao'], ['Experiência', 'experiencia'], ['Programas e iniciativas', 'programa'], ['Ferramentas e temas', 'ferramenta']].filter(g => M.cv[g[1]].length);
    const caixas = grupos.map(g => `<div class="box"><span class="ti">${g[0]}</span>${g[1] === 'ferramenta' ? `<div>${tags(M.cv.ferramenta)}</div>` : `<ul>${M.cv[g[1]].map(i => `<li><b>${esc(i.t)}</b><span>${esc(i.s)}</span></li>`).join('')}</ul>`}</div>`).join('');
    return `<div><span class="sec">CURRÍCULO</span><div class="cols">${caixas || '<div class="box"><p>Em breve.</p></div>'}</div></div>`;
  },
  projetos: () => `<div><span class="sec">ANÁLISES</span><div class="cols">${lista(M.analises, projCard('MISSÃO DE ANÁLISE'))}</div></div><div><span class="sec">PROJETOS DE CURSOS</span><div class="cols">${lista(M.projCursos, projCard('MISSÃO DE CURSO'))}</div></div>`,
  certificados: () => `<div><span class="sec">CERTIFICADOS</span><div class="cols">${lista(M.certs, certCard)}</div></div><div><span class="sec">EM ANDAMENTO</span><div class="cols">${lista(M.emCurso, cursoCard)}</div></div>`,
  sugestoes: () => `<div><span class="sec">SUGESTÃO DE CURSOS</span>${M.sugIntro ? `<p class="intro">${esc(M.sugIntro)}</p>` : ''}<div class="cols">${lista(M.sugestoes, sugCard)}</div></div>`
};

/* sprite do sorvete */
const SPR = ['.....LL.....','....LLLL....','....LLLL....','...PPPPPP...','..PHHPPPPP..','.PHHPPPPPPP.','.PHPPPPPPPP.','.PPPPPPPPPP.','PPPPPPPPPPPP','PP.PPPPP.PP.','.OOOOOOOOOO.','..ODODODOD..','..DODODODO..','...ODODOD...','....DODO....','.....OO.....'];
const PAL = { P: '#ff9ecf', H: '#ffe3f1', L: '#c6f23c', O: '#a64fd0', D: '#5e2a8a' };
(function () {
  const c = document.getElementById('spr'), s = 8;
  c.width = 12 * s; c.height = 16 * s;
  const x = c.getContext('2d');
  SPR.forEach((row, y) => [...row].forEach((ch, i) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i * s, y * s, s, s); } }));
  c.style.width = (12 * s) + 'px'; c.style.maxWidth = '100%'; c.style.height = 'auto';
})();

/* tela */
const main = document.getElementById('main');
main.addEventListener('error', e => {
  const el = e.target;
  if (el.tagName === 'IMG' && el.dataset.rotulo) el.outerHTML = fileIcon(el.dataset.rotulo);
}, true);
function aplicar() {
  document.getElementById('nome').textContent = M.nome;
  document.getElementById('classe').textContent = M.classe;
  document.getElementById('ficha').innerHTML = M.ficha.map(f => `<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('');
  const html = M.contatos.map(c => slot(c.url, c.label)).join('');
  const el = document.getElementById('contatos');
  el.hidden = !html;
  el.innerHTML = html ? `<span class="ti">Contatos</span><div class="contatos">${html}</div>` : '';
}
function show(tab) {
  if (!VIEWS[tab]) tab = 'sobre';
  main.innerHTML = VIEWS[tab]();
  main.setAttribute('aria-labelledby', 't-' + tab);
  document.querySelectorAll('.mi').forEach(b => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  });
}
const fromHash = () => location.hash.replace('#', '');
document.querySelectorAll('.mi').forEach(b => {
  b.addEventListener('click', () => { location.hash = b.dataset.tab; });
  b.addEventListener('keydown', e => {
    const tabs = [...document.querySelectorAll('.mi')], i = tabs.indexOf(b);
    const k = e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 0;
    if (!k) return;
    e.preventDefault();
    const n = tabs[(i + k + tabs.length) % tabs.length];
    n.focus(); location.hash = n.dataset.tab;
  });
});
window.addEventListener('hashchange', () => { if (M) show(fromHash()); });

/* carregamento: planilha primeiro, dados de reserva se falhar */
function status(txt) {
  if (!/[?&]status/.test(location.search)) return;
  const p = document.getElementById('status');
  p.textContent = 'Versão do site: ' + VERSAO + ' · Conteúdo: ' + txt;
  p.hidden = false;
}
async function carregar() {
  if (!PLANILHA_URL) { M = montar(PADRAO); status('dados do próprio arquivo (planilha ainda não configurada)'); return; }
  main.innerHTML = '<p class="carregando">CARREGANDO...</p>';
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const resp = await fetch(PLANILHA_URL + (PLANILHA_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { signal: ctl.signal });
    clearTimeout(to);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const linhas = lerLinhas(parseCSV(await resp.text()));
    if (!linhas.length) throw new Error('planilha vazia');
    M = montar(linhas);
    status('planilha carregada (' + linhas.length + ' linhas)');
  } catch (e) {
    M = montar(PADRAO);
    status('planilha indisponível (' + e.message + '), usando dados de reserva');
  }
}
carregar().then(() => { aplicar(); show(fromHash()); });
</script>
