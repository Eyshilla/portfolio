<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyshilla · Portfólio</title>
<meta name="description" content="Portfólio da Eyshilla em pixel art: currículo, projetinhos, certificados e sugestões de cursos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --night: #2a1244;
  --ink: #2a1244;
  --orchid: #a64fd0;
  --orchid-deep: #5e2a8a;
  --pink: #ff9ecf;
  --pink-soft: #ffdaec;
  --pink-deep: #e8579f;
  --lime: #c6f23c;
  --lime-deep: #9bc41f;
  --white: #ffffff;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --texto: "VT323", ui-monospace, monospace;
  --moldura: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 40px 20px 56px;
  min-width: 0;
  color: var(--ink);
  background-color: var(--pink-soft);
  background-image: radial-gradient(rgba(166, 79, 208, .16) 2px, transparent 2px);
  background-size: 20px 20px;
  font-family: var(--texto);
  font-size: 22px;
  line-height: 1.15;
  overflow-wrap: break-word;
}

h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }

a { color: var(--orchid-deep); }

:focus-visible { outline: 3px dashed var(--orchid-deep); outline-offset: 5px; }

.container {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 36px 32px;
  align-items: start;
}

.lateral { display: grid; gap: 36px; min-width: 0; }
.conteudo { min-width: 0; }

/* Caixa NES */
.box {
  position: relative;
  background: var(--white);
  box-shadow: var(--moldura);
  padding: 24px 20px 20px;
  min-width: 0;
}
.box-titulo {
  position: absolute;
  top: -9px;
  left: 14px;
  max-width: calc(100% - 28px);
  padding: 0 8px;
  background: var(--white);
  color: var(--orchid-deep);
  font-family: var(--pixel);
  font-size: 10px;
  font-weight: normal;
  line-height: 1.4;
  text-transform: uppercase;
}

/* Botões */
.btn {
  display: inline-block;
  padding: 11px 14px 13px;
  border: 0;
  background: var(--pink);
  color: var(--ink);
  box-shadow: var(--moldura), inset -4px -4px 0 0 var(--pink-deep);
  font-family: var(--pixel);
  font-size: 9px;
  line-height: 1.5;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { background: var(--pink-soft); }
.btn:active { transform: translateY(3px); }

/* Etiquetas */
.tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.box-titulo + .tags { margin-top: 0; }
.tag {
  display: inline-block;
  padding: 5px 7px 4px;
  background: var(--lime);
  color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink);
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
}

/* Lista com marcador quadrado */
.lista-quadrada { display: grid; gap: 14px; }
.lista-quadrada li { position: relative; padding-left: 24px; }
.lista-quadrada li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 7px;
  width: 10px;
  height: 10px;
  background: var(--orchid);
  box-shadow: 3px 3px 0 0 var(--pink);
}
.item-titulo { display: block; font-size: 22px; }
.item-detalhe { display: block; font-size: 20px; color: var(--orchid-deep); }

/* Jogadora 1 */
.jogadora { text-align: center; }
.mascote-moldura {
  display: inline-block;
  margin: 8px 0 18px;
  padding: 14px;
  background: var(--night);
  box-shadow: var(--moldura);
  line-height: 0;
}
.mascote-moldura canvas {
  display: block;
  width: 96px;
  height: 128px;
  image-rendering: pixelated;
}
.nome {
  font-family: var(--pixel);
  font-size: 15px;
  font-weight: normal;
  line-height: 1.5;
  color: var(--orchid-deep);
}
.classe { margin-top: 6px; font-size: 20px; }
.ficha { margin-top: 16px; text-align: left; }
.ficha-item { padding: 10px 0; }
.ficha-item + .ficha-item { border-top: 2px dotted var(--orchid); }
.ficha-item:last-child { padding-bottom: 0; }
.ficha dt {
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
  color: var(--pink-deep);
}
.ficha dd { margin-top: 4px; font-size: 20px; }

/* Menu */
.menu { display: grid; gap: 16px; padding: 4px; }
.menu-item {
  position: relative;
  width: 100%;
  padding: 13px 12px 15px 30px;
  text-align: left;
  font-size: 10px;
}
.menu-item[aria-selected="true"] {
  background: var(--lime);
  box-shadow: var(--moldura), inset -4px -4px 0 0 var(--lime-deep);
}
.menu-item[aria-selected="true"]::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 50%;
  margin-top: -7px;
  border-style: solid;
  border-width: 6px 0 6px 8px;
  border-color: transparent transparent transparent var(--ink);
}

.contatos { display: grid; gap: 16px; padding-top: 8px; }
.contatos .btn { width: 100%; }

/* Painéis */
.painel { display: grid; gap: 36px; }
.painel[hidden] { display: none; }

.texto-sobre { display: grid; gap: 12px; }
.texto-sobre .abertura { font-size: 26px; }

.destaques {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  padding: 3px;
}
.destaque {
  padding: 14px 12px;
  background: var(--pink-soft);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);
}
.destaque-rotulo {
  display: block;
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
  color: var(--pink-deep);
}
.destaque-valor { display: block; margin-top: 6px; font-size: 22px; }

.grade {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 36px 28px;
}
.grade-curriculo { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.bloco { display: grid; gap: 28px; }
.selo {
  justify-self: start;
  padding: 9px 12px 8px;
  background: var(--pink);
  color: var(--ink);
  box-shadow: 4px 4px 0 0 var(--ink);
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: normal;
  line-height: 1.5;
}

.card { display: flex; flex-direction: column; }
.legenda {
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
  color: var(--pink-deep);
}
.card-titulo {
  margin-top: 10px;
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: normal;
  line-height: 1.6;
  color: var(--orchid-deep);
}
.card-detalhe { margin-top: 6px; font-size: 20px; color: var(--orchid-deep); }
.card-texto { margin-top: 10px; }
.card-acoes { margin-top: auto; padding-top: 20px; }
.miniatura {
  display: block;
  width: 100%;
  height: auto;
  margin-bottom: 14px;
  box-shadow: 0 0 0 2px var(--ink);
  image-rendering: pixelated;
}

@media (max-width: 759px) {
  body { padding-top: 28px; }
  .container { grid-template-columns: minmax(0, 1fr); }
  .menu { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 18px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
<div class="container">
  <aside class="lateral">
    <section class="box jogadora" aria-labelledby="titulo-jogadora">
      <h2 class="box-titulo" id="titulo-jogadora">Jogadora 1</h2>
      <div class="mascote-moldura">
        <canvas id="mascote" width="96" height="128" role="img" aria-label="Mascote: sorvete em pixel art"></canvas>
      </div>
      <h1 class="nome" id="nome"></h1>
      <p class="classe" id="classe"></p>
      <dl class="ficha" id="ficha"></dl>
    </section>

    <nav aria-label="Seções do portfólio">
      <div class="menu" id="menu" role="tablist" aria-orientation="vertical"></div>
    </nav>

    <section class="box" id="caixa-contatos" aria-labelledby="titulo-contatos" hidden>
      <h2 class="box-titulo" id="titulo-contatos">Contatos</h2>
      <div class="contatos" id="contatos"></div>
    </section>
  </aside>

  <main class="conteudo" id="conteudo"></main>
</div>

<script>
'use strict';

/* Dados do portfólio. A ordem das linhas é a ordem na tela.
   Para esconder uma linha, use mostrar: "não". */
const PADRAO = [
  { tipo: "perfil", titulo: "EYSHILLA", detalhe: "Classe: estudante de Negócios e Produção", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ficha", titulo: "MISSÃO ATUAL", detalhe: "Business Intelligence", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ficha", titulo: "GUILDA", detalhe: "Rock Encantech (estágio em Planejamento e Eficiência)", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ficha", titulo: "FASE", detalhe: "7º semestre · dez/2028", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "sobre", titulo: "", detalhe: "", descricao: "Oi! Eu sou a Eyshilla. Estudo Negócios e Produção na UNIVESP (7º semestre) e faço estágio em Planejamento e Eficiência na Rock Encantech. Quero trabalhar com Business Intelligence: transformar dados e processos em decisões melhores.", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "sobre", titulo: "", detalhe: "", descricao: "Em 2026 participei do Sebrae Supernova e em 2025 ajudei a fundar um clube de pesquisa científica na minha faculdade, que levou a instituição a lançar um programa de iniciação científica em 2026.", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "destaque", titulo: "SEMESTRE", detalhe: "7º na UNIVESP", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "destaque", titulo: "FORMATURA", detalhe: "dez/2028", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "destaque", titulo: "FOCO", detalhe: "Business Intelligence e Dados", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "formacao", titulo: "Engenharia de Produção", detalhe: "UNIVESP · 7º semestre · formatura prevista em dez/2028", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "formacao", titulo: "Tecnologia Mecânica na modalidade Processos de Produção", detalhe: "Formação tecnológica", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "experiencia", titulo: "Estágio em Planejamento e Eficiência", detalhe: "Rock Encantech · desde abr/2025", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "programa", titulo: "Sebrae Supernova", detalhe: "Programa de empreendedorismo · Projeto Cuidadoula", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "programa", titulo: "Instituto Bold", detalhe: "Embaixadora desde 2023", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "programa", titulo: "Clube de pesquisa científica (GOMPU)", detalhe: "Em 2025, ajudei na criação e fundação; O impacto chamou a atenção da faculdade que criou o próprio programa de iniciação científica em 2026", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "programa", titulo: "Pulse Mais", detalhe: "desde 2025 atua como tutora de Excel nos módulos de capacitação tecnológica", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "Google Sheets", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "Análise de dados", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "OKRs", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "Mapeamento de processos", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "Business Intelligence", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "Excel Intermediário", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "PowerBI Básico", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "ferramenta", titulo: "Amazon Quick", detalhe: "", descricao: "", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "analise", titulo: "Avaliações da Pribox Esquadrias", detalhe: "", descricao: "Proposta de melhoria para uma empresa de esquadrias de alumínio, baseada em avaliações públicas de clientes, com foco nas negativas.", tags: "Análise de avaliações; Proposta", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "analise", titulo: "Trilha de análise de dados", detalhe: "", descricao: "Roadmap de estudo estruturado para desenvolver as habilidades de análise de dados rumo a BI.", tags: "Estudo; BI", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "projeto_curso", titulo: "Projeto Integrador: esquadrias", detalhe: "", descricao: "Mapeamento dos processos de vendas e pós-venda de uma empresa de esquadrias, feito na UNIVESP.", tags: "Processos; UNIVESP", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "projeto_curso", titulo: "Ferramenta Realizados", detalhe: "", descricao: "Barra lateral em Google Apps Script para a planilha de registros do grupo do projeto integrador.", tags: "Apps Script; Sheets", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "certificado", titulo: "EXEMPLO: Nome do certificado", detalhe: "Instituição · 2025 · 20h", descricao: "", tags: "Tema; Outro tema", link: "", arquivo: "exemplo.pdf", miniatura: "", mostrar: "não" },
  { tipo: "em_andamento", titulo: "EXEMPLO: Nome do curso em andamento", detalhe: "Plataforma · previsão: mês/ano", descricao: "", tags: "Tema", link: "", arquivo: "", miniatura: "", mostrar: "não" },
  { tipo: "intro_sugestoes", titulo: "", detalhe: "", descricao: "Cursos que eu recomendo para quem quer começar em dados, negócios e processos.", tags: "", link: "", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "sugestao", titulo: "EXEMPLO: Nome do curso", detalhe: "Plataforma · Iniciante", descricao: "Por que eu recomendo este curso, em uma ou duas frases.", tags: "Tema", link: "https://exemplo.com", arquivo: "", miniatura: "", mostrar: "não" },
  { tipo: "contato", titulo: "GITHUB", detalhe: "", descricao: "", tags: "", link: "https://github.com/Eyshilla/", arquivo: "", miniatura: "", mostrar: "" },
  { tipo: "contato", titulo: "LINKEDIN", detalhe: "", descricao: "", tags: "", link: "https://www.linkedin.com/in/eyshilla-lima", arquivo: "", miniatura: "", mostrar: "" }
];
(function () {
  const CHAVES = ['tipo', 'titulo', 'detalhe', 'descricao', 'tags', 'link', 'arquivo', 'miniatura', 'mostrar'];
  const OCULTO = ['não', 'nao', 'n', '0', 'false'];

  const ABAS = [
    { id: 'sobre', rotulo: 'SOBRE MIM' },
    { id: 'curriculo', rotulo: 'CURRÍCULO' },
    { id: 'projetos', rotulo: 'PROJETINHOS' },
    { id: 'certificados', rotulo: 'CERTIFICADOS' },
    { id: 'sugestoes', rotulo: 'SUGESTÃO DE CURSOS' }
  ];

  const MASCOTE = [
    '.....LL.....',
    '....LLLL....',
    '....LLLL....',
    '...PPPPPP...',
    '..PHHPPPPP..',
    '.PHHPPPPPPP.',
    '.PHPPPPPPPP.',
    '.PPPPPPPPPP.',
    'PPPPPPPPPPPP',
    'PP.PPPPP.PP.',
    '.OOOOOOOOOO.',
    '..ODODODOD..',
    '..DODODODO..',
    '...ODODOD...',
    '....DODO....',
    '.....OO.....'
  ];
  const CORES = { P: '#ff9ecf', H: '#ffe3f1', L: '#c6f23c', O: '#a64fd0', D: '#5e2a8a' };

  const $ = (id) => document.getElementById(id);

  function texto(v) {
    return v === undefined || v === null ? '' : String(v);
  }

  function esc(v) {
    return texto(v).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function visivel(linha) {
    return !OCULTO.includes(texto(linha.mostrar).trim().toLowerCase());
  }

  const dados = (Array.isArray(PADRAO) ? PADRAO : [])
    .filter((linha) => linha && typeof linha === 'object' && visivel(linha))
    .map((linha) => {
      const limpa = {};
      CHAVES.forEach((k) => { limpa[k] = texto(linha[k]).trim(); });
      limpa.tipo = limpa.tipo.toLowerCase();
      return limpa;
    });

  const doTipo = (tipo) => dados.filter((l) => l.tipo === tipo);

  /* Aceita apenas http:, https:, mailto: ou caminhos relativos. */
  function urlSegura(valor) {
    const url = texto(valor).trim();
    if (!url) return '';
    const semControle = url.replace(/[\u0000-\u0020\u007f-\u009f]/g, '');
    if (/^[a-z][a-z0-9+.\-]*:/i.test(semControle)) {
      return /^(https?|mailto):/i.test(semControle) ? url : '';
    }
    if (/^[\\/]{2}/.test(semControle)) return '';
    return url;
  }

  function caminhoCertificado(valor) {
    const nome = texto(valor).trim();
    if (!nome) return '';
    if (/[:\/\\]/.test(nome)) return urlSegura(nome);
    return 'certificados/' + encodeURIComponent(nome);
  }

  function botao(url, rotulo) {
    const href = urlSegura(url);
    if (!href) return '';
    const alvo = /^mailto:/i.test(href.replace(/[\u0000-\u0020]/g, '')) ? '' : ' target="_blank" rel="noopener"';
    return '<a class="btn" href="' + esc(href) + '"' + alvo + '>' + esc(rotulo) + '</a>';
  }

  function tags(valor) {
    const lista = texto(valor).split(';').map((t) => t.trim()).filter(Boolean);
    if (!lista.length) return '';
    return '<ul class="tags">' + lista.map((t) => '<li class="tag">' + esc(t) + '</li>').join('') + '</ul>';
  }

  function caixa(titulo, corpo, extraClasse) {
    return '<section class="box' + (extraClasse ? ' ' + extraClasse : '') + '">' +
      (titulo ? '<h2 class="box-titulo">' + esc(titulo) + '</h2>' : '') + corpo + '</section>';
  }

  function emBreve() {
    return caixa('', '<p>Em breve.</p>');
  }

  function bloco(selo, corpo) {
    return '<section class="bloco"><h2 class="selo">' + esc(selo) + '</h2>' + corpo + '</section>';
  }

  /* Mascote */
  function desenharMascote() {
    const canvas = $('mascote');
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) return;
    const px = 8;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    MASCOTE.forEach((linha, y) => {
      for (let x = 0; x < linha.length; x++) {
        const cor = CORES[linha[x]];
        if (!cor) continue;
        ctx.fillStyle = cor;
        ctx.fillRect(x * px, y * px, px, px);
      }
    });
  }

  /* Coluna esquerda */
  function montarLateral() {
    const perfil = doTipo('perfil')[0];
    if (perfil) {
      $('nome').textContent = perfil.titulo;
      $('classe').textContent = perfil.detalhe;
      if (perfil.titulo) document.title = perfil.titulo + ' · Portfólio';
    }
    $('ficha').innerHTML = doTipo('ficha').slice(0, 3).map((l) =>
      '<div class="ficha-item"><dt>' + esc(l.titulo) + '</dt><dd>' + esc(l.detalhe) + '</dd></div>'
    ).join('');

    const contatos = doTipo('contato').map((l) => botao(l.link, l.titulo)).filter(Boolean);
    if (contatos.length) {
      $('contatos').innerHTML = contatos.join('');
      $('caixa-contatos').hidden = false;
    }
  }

  /* Abas */
  function painelSobre() {
    const paragrafos = doTipo('sobre').filter((l) => l.descricao);
    let html = '';
    if (paragrafos.length) {
      html += caixa('Sobre mim', '<div class="texto-sobre">' + paragrafos.map((l, i) =>
        '<p' + (i === 0 ? ' class="abertura"' : '') + '>' + esc(l.descricao) + '</p>'
      ).join('') + '</div>');
    }
    const destaques = doTipo('destaque');
    if (destaques.length) {
      html += '<ul class="destaques" aria-label="Destaques">' + destaques.map((l) =>
        '<li class="destaque"><span class="destaque-rotulo">' + esc(l.titulo) +
        '</span><span class="destaque-valor">' + esc(l.detalhe) + '</span></li>'
      ).join('') + '</ul>';
    }
    return html || emBreve();
  }

  function painelCurriculo() {
    const grupos = [
      { tipo: 'formacao', titulo: 'Formação' },
      { tipo: 'experiencia', titulo: 'Experiência' },
      { tipo: 'programa', titulo: 'Programas e iniciativas' }
    ];
    const caixas = grupos.map((g) => {
      const itens = doTipo(g.tipo).filter((l) => l.titulo || l.detalhe);
      if (!itens.length) return '';
      return caixa(g.titulo, '<ul class="lista-quadrada">' + itens.map((l) =>
        '<li><span class="item-titulo">' + esc(l.titulo) + '</span>' +
        (l.detalhe ? '<span class="item-detalhe">' + esc(l.detalhe) + '</span>' : '') + '</li>'
      ).join('') + '</ul>');
    }).filter(Boolean);

    const ferramentas = doTipo('ferramenta').map((l) => l.titulo).filter(Boolean);
    if (ferramentas.length) {
      caixas.push(caixa('Ferramentas e temas', tags(ferramentas.join(';'))));
    }
    return caixas.length ? '<div class="grade grade-curriculo">' + caixas.join('') + '</div>' : emBreve();
  }

  function cardProjeto(l, legenda) {
    return '<article class="box card">' +
      '<p class="legenda">' + esc(legenda) + '</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.descricao ? '<p class="card-texto">' + esc(l.descricao) + '</p>' : '') +
      tags(l.tags) +
      (urlSegura(l.link) ? '<div class="card-acoes">' + botao(l.link, 'VER NO GITHUB ▶') + '</div>' : '') +
      '</article>';
  }

  function grade(itens, fn) {
    return itens.length ? '<div class="grade">' + itens.map(fn).join('') + '</div>' : emBreve();
  }

  function painelProjetos() {
    return bloco('ANÁLISES', grade(doTipo('analise'), (l) => cardProjeto(l, 'MISSÃO DE ANÁLISE'))) +
      bloco('PROJETOS DE CURSOS', grade(doTipo('projeto_curso'), (l) => cardProjeto(l, 'MISSÃO DE CURSO')));
  }

  function cardCertificado(l) {
    const destino = urlSegura(l.link) || caminhoCertificado(l.arquivo);
    const mini = caminhoCertificado(l.miniatura);
    const miniOk = mini && !/^mailto:/i.test(mini);
    return '<article class="box card">' +
      (miniOk ? '<img class="miniatura" src="' + esc(mini) + '" alt="Miniatura: ' + esc(l.titulo) + '" loading="lazy">' : '') +
      '<p class="legenda">CONQUISTA</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.detalhe ? '<p class="card-detalhe">' + esc(l.detalhe) + '</p>' : '') +
      tags(l.tags) +
      (destino ? '<div class="card-acoes">' + botao(destino, 'VER CERTIFICADO ▶') + '</div>' : '') +
      '</article>';
  }

  function cardAndamento(l) {
    return '<article class="box card">' +
      '<p class="legenda">EM PROGRESSO</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.detalhe ? '<p class="card-detalhe">' + esc(l.detalhe) + '</p>' : '') +
      tags(l.tags) +
      '</article>';
  }

  function painelCertificados() {
    return bloco('CERTIFICADOS', grade(doTipo('certificado'), cardCertificado)) +
      bloco('EM ANDAMENTO', grade(doTipo('em_andamento'), cardAndamento));
  }

  function cardSugestao(l) {
    return '<article class="box card">' +
      '<p class="legenda">INDICAÇÃO</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.detalhe ? '<p class="card-detalhe">' + esc(l.detalhe) + '</p>' : '') +
      (l.descricao ? '<p class="card-texto">' + esc(l.descricao) + '</p>' : '') +
      tags(l.tags) +
      (urlSegura(l.link) ? '<div class="card-acoes">' + botao(l.link, 'VER CURSO ▶') + '</div>' : '') +
      '</article>';
  }

  function painelSugestoes() {
    const intro = doTipo('intro_sugestoes').filter((l) => l.descricao);
    return (intro.length ? caixa('Sugestão de cursos', '<div class="texto-sobre">' +
      intro.map((l) => '<p>' + esc(l.descricao) + '</p>').join('') + '</div>') : '') +
      grade(doTipo('sugestao'), cardSugestao);
  }

  const MONTADORES = {
    sobre: painelSobre,
    curriculo: painelCurriculo,
    projetos: painelProjetos,
    certificados: painelCertificados,
    sugestoes: painelSugestoes
  };

  function montarAbas() {
    $('menu').innerHTML = ABAS.map((a) =>
      '<button type="button" class="btn menu-item" role="tab" id="aba-' + a.id + '" ' +
      'aria-controls="painel-' + a.id + '" aria-selected="false" tabindex="-1" data-aba="' + a.id + '">' +
      esc(a.rotulo) + '</button>'
    ).join('');
    $('conteudo').innerHTML = ABAS.map((a) =>
      '<section class="painel" role="tabpanel" id="painel-' + a.id + '" aria-labelledby="aba-' + a.id + '" tabindex="0" hidden>' +
      MONTADORES[a.id]() + '</section>'
    ).join('');
  }

  function abaDoHash() {
    const id = decodeURIComponent(location.hash.replace(/^#/, ''));
    return ABAS.some((a) => a.id === id) ? id : 'sobre';
  }

  function mostrarAba(id) {
    ABAS.forEach((a) => {
      const ativa = a.id === id;
      const aba = $('aba-' + a.id);
      aba.setAttribute('aria-selected', ativa ? 'true' : 'false');
      aba.tabIndex = ativa ? 0 : -1;
      $('painel-' + a.id).hidden = !ativa;
    });
  }

  function irPara(id, focar) {
    if (location.hash !== '#' + id) location.hash = id;
    mostrarAba(id);
    if (focar) $('aba-' + id).focus();
  }

  function ligarEventos() {
    const menu = $('menu');
    menu.addEventListener('click', (ev) => {
      const alvo = ev.target.closest('[role="tab"]');
      if (alvo) irPara(alvo.dataset.aba, false);
    });
    menu.addEventListener('keydown', (ev) => {
      const alvo = ev.target.closest('[role="tab"]');
      if (!alvo) return;
      const atual = ABAS.findIndex((a) => a.id === alvo.dataset.aba);
      let prox = -1;
      switch (ev.key) {
        case 'ArrowDown':
        case 'ArrowRight': prox = (atual + 1) % ABAS.length; break;
        case 'ArrowUp':
        case 'ArrowLeft': prox = (atual - 1 + ABAS.length) % ABAS.length; break;
        case 'Home': prox = 0; break;
        case 'End': prox = ABAS.length - 1; break;
        default: return;
      }
      ev.preventDefault();
      irPara(ABAS[prox].id, true);
    });
    window.addEventListener('hashchange', () => mostrarAba(abaDoHash()));
  }

  desenharMascote();
  montarLateral();
  montarAbas();
  ligarEventos();
  mostrarAba(abaDoHash());
})();
</script>
</body>
</html>
