<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyshilla · Portfólio</title>
<meta name="description" content="Portfólio da Eyshilla em pixel art: currículo, projetinhos, certificados e sugestões de cursos.">

<style>
:root {
  --night: #2a1244;
  --ink: #2a1244;
  --orchid: #a64fd0;
  --orchid-deep: #5e2a8a;
  --pink: #ff9ecf;
  --pink-soft: #ffdaec;
  --pink-deep: #e8579f;
  --lime: #c6f23c;
  --lime-deep: #9bc41f;
  --white: #ffffff;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --texto: "VT323", ui-monospace, monospace;
  --moldura: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 40px 20px 56px;
  min-width: 0;
  color: var(--ink);
  background-color: var(--pink-soft);
  background-image: radial-gradient(rgba(166, 79, 208, .16) 2px, transparent 2px);
  background-size: 20px 20px;
  font-family: var(--texto);
  font-size: 22px;
  line-height: 1.15;
  overflow-wrap: break-word;
}

h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }

a { color: var(--orchid-deep); }

:focus-visible { outline: 3px dashed var(--orchid-deep); outline-offset: 5px; }

.container {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 36px 32px;
  align-items: start;
}

.lateral { display: grid; gap: 36px; min-width: 0; }
.conteudo { min-width: 0; }

/* Caixa NES */
.box {
  position: relative;
  background: var(--white);
  box-shadow: var(--moldura);
  padding: 24px 20px 20px;
  min-width: 0;
}
.box-titulo {
  position: absolute;
  top: -9px;
  left: 14px;
  max-width: calc(100% - 28px);
  padding: 0 8px;
  background: var(--white);
  color: var(--orchid-deep);
  font-family: var(--pixel);
  font-size: 10px;
  font-weight: normal;
  line-height: 1.4;
  text-transform: uppercase;
}

/* Botões */
.btn {
  display: inline-block;
  padding: 11px 14px 13px;
  border: 0;
  background: var(--pink);
  color: var(--ink);
  box-shadow: var(--moldura), inset -4px -4px 0 0 var(--pink-deep);
  font-family: var(--pixel);
  font-size: 9px;
  line-height: 1.5;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { background: var(--pink-soft); }
.btn:active { transform: translateY(3px); }

/* Etiquetas */
.tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.box-titulo + .tags { margin-top: 0; }
.tag {
  display: inline-block;
  padding: 5px 7px 4px;
  background: var(--lime);
  color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink);
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
}

/* Lista com marcador quadrado */
.lista-quadrada { display: grid; gap: 14px; }
.lista-quadrada li { position: relative; padding-left: 24px; }
.lista-quadrada li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 7px;
  width: 10px;
  height: 10px;
  background: var(--orchid);
  box-shadow: 3px 3px 0 0 var(--pink);
}
.item-titulo { display: block; font-size: 22px; }
.item-detalhe { display: block; font-size: 20px; color: var(--orchid-deep); }

/* Jogadora 1 */
.jogadora { text-align: center; }
.mascote-moldura {
  display: inline-block;
  margin: 8px 0 18px;
  padding: 14px;
  background: var(--night);
  box-shadow: var(--moldura);
  line-height: 0;
}
.mascote-moldura canvas {
  display: block;
  width: 96px;
  height: 128px;
  image-rendering: pixelated;
}
.nome {
  font-family: var(--pixel);
  font-size: 15px;
  font-weight: normal;
  line-height: 1.5;
  color: var(--orchid-deep);
}
.classe { margin-top: 6px; font-size: 20px; }
.ficha { margin-top: 16px; text-align: left; }
.ficha-item { padding: 10px 0; }
.ficha-item + .ficha-item { border-top: 2px dotted var(--orchid); }
.ficha-item:last-child { padding-bottom: 0; }
.ficha dt {
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
  color: var(--pink-deep);
}
.ficha dd { margin-top: 4px; font-size: 20px; }

/* Menu */
.menu { display: grid; gap: 16px; padding: 4px; }
.menu-item {
  position: relative;
  width: 100%;
  padding: 13px 12px 15px 30px;
  text-align: left;
  font-size: 10px;
}
.menu-item[aria-selected="true"] {
  background: var(--lime);
  box-shadow: var(--moldura), inset -4px -4px 0 0 var(--lime-deep);
}
.menu-item[aria-selected="true"]::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 50%;
  margin-top: -7px;
  border-style: solid;
  border-width: 6px 0 6px 8px;
  border-color: transparent transparent transparent var(--ink);
}

.contatos { display: grid; gap: 16px; padding-top: 8px; }
.contatos .btn { width: 100%; }

/* Painéis */
.painel { display: grid; gap: 36px; }
.painel[hidden] { display: none; }

.texto-sobre { display: grid; gap: 12px; }
.texto-sobre .abertura { font-size: 26px; }

.destaques {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  padding: 3px;
}
.destaque {
  padding: 14px 12px;
  background: var(--pink-soft);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);
}
.destaque-rotulo {
  display: block;
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
  color: var(--pink-deep);
}
.destaque-valor { display: block; margin-top: 6px; font-size: 22px; }

.grade {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 36px 28px;
}
.grade-curriculo { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.bloco { display: grid; gap: 28px; }
.selo {
  justify-self: start;
  padding: 9px 12px 8px;
  background: var(--pink);
  color: var(--ink);
  box-shadow: 4px 4px 0 0 var(--ink);
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: normal;
  line-height: 1.5;
}

.card { display: flex; flex-direction: column; }
.legenda {
  font-family: var(--pixel);
  font-size: 8px;
  line-height: 1.5;
  color: var(--pink-deep);
}
.card-titulo {
  margin-top: 10px;
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: normal;
  line-height: 1.6;
  color: var(--orchid-deep);
}
.card-detalhe { margin-top: 6px; font-size: 20px; color: var(--orchid-deep); }
.card-texto { margin-top: 10px; }
.card-acoes { margin-top: auto; padding-top: 20px; }
.miniatura {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 7 / 5;
  margin: 3px 3px 18px;
  overflow: hidden;
  background: var(--pink-soft);
  box-shadow: 0 0 0 3px var(--ink);

.miniatura img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}
.icone-arquivo { display: block; flex: none; }
.ic-ink { fill: var(--ink); }
.ic-folha { fill: var(--pink); }
.ic-dobra { fill: var(--pink-soft); }
.ic-etiqueta { fill: var(--lime); }
.ic-texto { fill: var(--ink); font-family: var(--pixel); font-size: 8px; }

.carregando {
  font-family: var(--pixel);
  font-size: 11px;
  line-height: 1.6;
  color: var(--orchid-deep);
}

.status {
  max-width: 1000px;
  margin: 40px auto 0;
  font-size: 18px;
  opacity: .7;
}
.status[hidden] { display: none; }

@media (max-width: 759px) {
  body { padding-top: 28px; }
  .container { grid-template-columns: minmax(0, 1fr); }
  .menu { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 18px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  .btn:active { transform: none; }
}
</style>
</head>

(function () {
  const CHAVES = ['tipo', 'titulo', 'detalhe', 'descricao', 'tags', 'link', 'arquivo', 'miniatura', 'mostrar'];
  const OCULTO = ['não', 'nao', 'n', '0', 'false'];
  const EXT_IMAGEM = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'avif'];
  const TEMPO_LIMITE_MS = 8000;

  const ABAS = [
    { id: 'sobre', rotulo: 'SOBRE MIM' },
    { id: 'curriculo', rotulo: 'CURRÍCULO' },
    { id: 'projetos', rotulo: 'PROJETINHOS' },
    { id: 'certificados', rotulo: 'CERTIFICADOS' },
    { id: 'sugestoes', rotulo: 'SUGESTÃO DE CURSOS' }
  ];

  const MASCOTE = [
    '.....LL.....',
    '....LLLL....',
    '....LLLL....',
    '...PPPPPP...',
    '..PHHPPPPP..',
    '.PHHPPPPPPP.',
    '.PHPPPPPPPP.',
    '.PPPPPPPPPP.',
    'PPPPPPPPPPPP',
    'PP.PPPPP.PP.',
    '.OOOOOOOOOO.',
    '..ODODODOD..',
    '..DODODODO..',
    '...ODODOD...',
    '....DODO....',
    '.....OO.....'
  ];
  const CORES = { P: '#ff9ecf', H: '#ffe3f1', L: '#c6f23c', O: '#a64fd0', D: '#5e2a8a' };

  const $ = (id) => document.getElementById(id);
  let dados = [];

  function texto(v) {
    return v === undefined || v === null ? '' : String(v);
  }

  function esc(v) {
    return texto(v).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function semAcento(v) {
    return texto(v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  }

  function visivel(linha) {
    return !OCULTO.includes(texto(linha.mostrar).trim().toLowerCase());
  }

  const doTipo = (tipo) => dados.filter((l) => l.tipo === tipo);

  /* ---------- Planilha (CSV) ---------- */

  /* Parser de CSV: campos entre aspas, "" escapado, vírgulas e quebras de linha dentro de campos, \r\n. */
  function lerCsv(conteudo) {
    const txt = texto(conteudo).replace(/^\uFEFF/, '');
    const linhas = [];
    let linha = [];
    let campo = '';
    let entreAspas = false;
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      if (entreAspas) {
        if (c === '"') {
          if (txt[i + 1] === '"') { campo += '"'; i++; } else { entreAspas = false; }
        } else {
          campo += c;
        }
      } else if (c === '"') {
        entreAspas = true;
      } else if (c === ',') {
        linha.push(campo); campo = '';
      } else if (c === '\r' || c === '\n') {
        if (c === '\r' && txt[i + 1] === '\n') i++;
        linha.push(campo); linhas.push(linha);
        linha = []; campo = '';
      } else {
        campo += c;
      }
    }
    if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
    return linhas.filter((l) => l.some((v) => v.trim() !== ''));
  }

  function linhasDaPlanilha(conteudo) {
    const tabela = lerCsv(conteudo);
    if (!tabela.length) throw new Error('planilha vazia');
    const cabecalho = tabela[0].map(semAcento);
    const indice = {};
    CHAVES.forEach((k) => { indice[k] = cabecalho.indexOf(k); });
    if (indice.tipo < 0) throw new Error('coluna "tipo" não encontrada');
    const linhas = tabela.slice(1).map((valores) => {
      const obj = {};
      CHAVES.forEach((k) => { obj[k] = indice[k] >= 0 ? texto(valores[indice[k]]) : ''; });
      return obj;
    }).filter((l) => l.tipo.trim() !== '');
    if (!linhas.length) throw new Error('planilha vazia');
    return linhas;
  }

  async function carregarPlanilha(url) {
    const controle = new AbortController();
    const timer = setTimeout(() => controle.abort(), TEMPO_LIMITE_MS);
    try {
      const endereco = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      let resposta;
      try {
        resposta = await fetch(endereco, { signal: controle.signal, cache: 'no-store' });
      } catch (e) {
        throw new Error(e && e.name === 'AbortError' ? 'tempo esgotado' : 'sem conexão');
      }
      if (resposta.status !== 200) throw new Error('HTTP ' + resposta.status);
      return linhasDaPlanilha(await resposta.text());
    } finally {
      clearTimeout(timer);
    }
  }

  /* ---------- Links e caminhos ---------- */

  /* Aceita apenas http:, https:, mailto: ou caminhos relativos. */
  function urlSegura(valor) {
    const url = texto(valor).trim();
    if (!url) return '';
    const semControle = url.replace(/[\u0000-\u0020\u007f-\u009f]/g, '');
    if (/^[a-z][a-z0-9+.\-]*:/i.test(semControle)) {
      return /^(https?|mailto):/i.test(semControle) ? url : '';
    }
    if (/^[\\/]{2}/.test(semControle)) return '';
    return url;
  }

  /* arquivo/miniatura: só o nome do arquivo (vai para PASTA); http(s) é usado como está. */
  function caminhoArquivo(valor) {
    let nome = texto(valor).trim();
    if (!nome) return '';
    if (/^https?:/i.test(nome.replace(/[\u0000-\u0020]/g, ''))) return urlSegura(nome);
    if (nome.indexOf(PASTA) === 0) nome = nome.slice(PASTA.length);
    return urlSegura(PASTA + encodeURI(nome).replace(/#/g, '%23').replace(/\?/g, '%3F'));
  }

  function extensao(url) {
    const caminho = texto(url).split(/[?#]/)[0];
    const m = /\.([a-z0-9]+)$/i.exec(caminho);
    return m ? m[1].toLowerCase() : '';
  }

  function atributosLink(href) {
    return /^mailto:/i.test(href.replace(/[\u0000-\u0020]/g, '')) ? '' : ' target="_blank" rel="noopener"';
  }

  function botao(url, rotulo) {
    const href = urlSegura(url);
    if (!href) return '';
    return '<a class="btn" href="' + esc(href) + '"' + atributosLink(href) + '>' + esc(rotulo) + '</a>';
  }

  function tags(valor) {
    const lista = texto(valor).split(';').map((t) => t.trim()).filter(Boolean);
    if (!lista.length) return '';
    return '<ul class="tags">' + lista.map((t) => '<li class="tag">' + esc(t) + '</li>').join('') + '</ul>';
  }

  function caixa(titulo, corpo, extraClasse) {
    return '<section class="box' + (extraClasse ? ' ' + extraClasse : '') + '">' +
      (titulo ? '<h2 class="box-titulo">' + esc(titulo) + '</h2>' : '') + corpo + '</section>';
  }

  function emBreve() {
    return caixa('', '<p>Em breve.</p>');
  }

  function bloco(selo, corpo) {
    return '<section class="bloco"><h2 class="selo">' + esc(selo) + '</h2>' + corpo + '</section>';
  }

  /* Ícone de arquivo em pixel art (48x60). */
  function iconeArquivo(rotulo) {
    return '<svg class="icone-arquivo" width="48" height="60" viewBox="0 0 48 60" shape-rendering="crispEdges" ' +
      'aria-hidden="true" focusable="false" data-icone="' + esc(rotulo) + '">' +
      '<path class="ic-ink" d="M6 2H34V6H38V10H42V14H46V58H6Z"/>' +
      '<path class="ic-folha" d="M10 6H30V18H42V54H10Z"/>' +
      '<path class="ic-dobra" d="M30 6H32V10H36V14H40V16H30Z"/>' +
      '<path class="ic-ink" d="M30 16H42V18H30ZM30 6H32V16H30ZM32 8H34V10H32ZM34 10H36V12H34ZM36 12H38V14H36ZM38 14H40V16H38Z"/>' +
      '<rect class="ic-ink" x="0" y="28" width="42" height="20"/>' +
      '<rect class="ic-etiqueta" x="2" y="30" width="38" height="16"/>' +
      '<text class="ic-texto" x="21" y="42" text-anchor="middle">' + esc(rotulo) + '</text>' +
      '</svg>';
  }

  /* ---------- Mascote ---------- */
  function desenharMascote() {
    const canvas = $('mascote');
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) return;
    const px = 8;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    MASCOTE.forEach((linha, y) => {
      for (let x = 0; x < linha.length; x++) {
        const cor = CORES[linha[x]];
        if (!cor) continue;
        ctx.fillStyle = cor;
        ctx.fillRect(x * px, y * px, px, px);
      }
    });
  }

  /* ---------- Coluna esquerda ---------- */
  function montarLateral() {
    const perfil = doTipo('perfil')[0];
    $('nome').textContent = perfil ? perfil.titulo : '';
    $('classe').textContent = perfil ? perfil.detalhe : '';
    if (perfil && perfil.titulo) document.title = perfil.titulo + ' · Portfólio';
    $('ficha').innerHTML = doTipo('ficha').slice(0, 3).map((l) =>
      '<div class="ficha-item"><dt>' + esc(l.titulo) + '</dt><dd>' + esc(l.detalhe) + '</dd></div>'
    ).join('');

    const contatos = doTipo('contato').map((l) => botao(l.link, l.titulo)).filter(Boolean);
    $('contatos').innerHTML = contatos.join('');
    $('caixa-contatos').hidden = !contatos.length;
  }

  /* ---------- Abas ---------- */
  function painelSobre() {
    const paragrafos = doTipo('sobre').filter((l) => l.descricao);
    let html = '';
    if (paragrafos.length) {
      html += caixa('Sobre mim', '<div class="texto-sobre">' + paragrafos.map((l, i) =>
        '<p' + (i === 0 ? ' class="abertura"' : '') + '>' + esc(l.descricao) + '</p>'
      ).join('') + '</div>');
    }
    const destaques = doTipo('destaque');
    if (destaques.length) {
      html += '<ul class="destaques" aria-label="Destaques">' + destaques.map((l) =>
        '<li class="destaque"><span class="destaque-rotulo">' + esc(l.titulo) +
        '</span><span class="destaque-valor">' + esc(l.detalhe) + '</span></li>'
      ).join('') + '</ul>';
    }
    return html || emBreve();
  }

  function painelCurriculo() {
    const grupos = [
      { tipo: 'formacao', titulo: 'Formação' },
      { tipo: 'experiencia', titulo: 'Experiência' },
      { tipo: 'programa', titulo: 'Programas e iniciativas' }
    ];
    const caixas = grupos.map((g) => {
      const itens = doTipo(g.tipo).filter((l) => l.titulo || l.detalhe);
      if (!itens.length) return '';
      return caixa(g.titulo, '<ul class="lista-quadrada">' + itens.map((l) =>
        '<li><span class="item-titulo">' + esc(l.titulo) + '</span>' +
        (l.detalhe ? '<span class="item-detalhe">' + esc(l.detalhe) + '</span>' : '') + '</li>'
      ).join('') + '</ul>');
    }).filter(Boolean);

    const ferramentas = doTipo('ferramenta').map((l) => l.titulo).filter(Boolean);
    if (ferramentas.length) caixas.push(caixa('Ferramentas e temas', tags(ferramentas.join(';'))));
    return caixas.length ? '<div class="grade grade-curriculo">' + caixas.join('') + '</div>' : emBreve();
  }

  function cardProjeto(l, legenda) {
    return '<article class="box card">' +
      '<p class="legenda">' + esc(legenda) + '</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.descricao ? '<p class="card-texto">' + esc(l.descricao) + '</p>' : '') +
      tags(l.tags) +
      (urlSegura(l.link) ? '<div class="card-acoes">' + botao(l.link, 'VER NO GITHUB ▶') + '</div>' : '') +
      '</article>';
  }

  function grade(itens, fn) {
    return itens.length ? '<div class="grade">' + itens.map(fn).join('') + '</div>' : emBreve();
  }

  function painelProjetos() {
    return bloco('ANÁLISES', grade(doTipo('analise'), (l) => cardProjeto(l, 'MISSÃO DE ANÁLISE'))) +
      bloco('PROJETOS DE CURSOS', grade(doTipo('projeto_curso'), (l) => cardProjeto(l, 'MISSÃO DE CURSO')));
  }

  function miniaturaCertificado(l, destino) {
    if (!destino) return '';
    const ext = extensao(destino);
    const rotuloIcone = ext === 'pdf' ? 'PDF' : 'LINK';
    let imagem = caminhoArquivo(l.miniatura);
    if (!imagem && EXT_IMAGEM.includes(ext)) imagem = destino;
    const conteudo = imagem
      ? '<img src="' + esc(imagem) + '" alt="Certificado: ' + esc(l.titulo) + '" loading="lazy" data-icone="' + rotuloIcone + '">'
      : iconeArquivo(rotuloIcone);
    return '<a class="miniatura" href="' + esc(destino) + '"' + atributosLink(destino) +
      ' aria-label="Abrir certificado: ' + esc(l.titulo) + '">' + conteudo + '</a>';
  }

  function cardCertificado(l) {
    const destino = urlSegura(l.link) || caminhoArquivo(l.arquivo);
    return '<article class="box card">' +
      miniaturaCertificado(l, destino) +
      '<p class="legenda">CONQUISTA</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.detalhe ? '<p class="card-detalhe">' + esc(l.detalhe) + '</p>' : '') +
      tags(l.tags) +
      (destino ? '<div class="card-acoes">' + botao(destino, 'VER CERTIFICADO ▶') + '</div>' : '') +
      '</article>';
  }

  function cardAndamento(l) {
    return '<article class="box card">' +
      '<p class="legenda">EM PROGRESSO</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.detalhe ? '<p class="card-detalhe">' + esc(l.detalhe) + '</p>' : '') +
      tags(l.tags) +
      '</article>';
  }

  function painelCertificados() {
    return bloco('CERTIFICADOS', grade(doTipo('certificado'), cardCertificado)) +
      bloco('EM ANDAMENTO', grade(doTipo('em_andamento'), cardAndamento));
  }

  function cardSugestao(l) {
    return '<article class="box card">' +
      '<p class="legenda">INDICAÇÃO</p>' +
      '<h3 class="card-titulo">' + esc(l.titulo) + '</h3>' +
      (l.detalhe ? '<p class="card-detalhe">' + esc(l.detalhe) + '</p>' : '') +
      (l.descricao ? '<p class="card-texto">' + esc(l.descricao) + '</p>' : '') +
      tags(l.tags) +
      (urlSegura(l.link) ? '<div class="card-acoes">' + botao(l.link, 'VER CURSO ▶') + '</div>' : '') +
      '</article>';
  }

  function painelSugestoes() {
    const intro = doTipo('intro_sugestoes').filter((l) => l.descricao);
    return (intro.length ? caixa('Sugestão de cursos', '<div class="texto-sobre">' +
      intro.map((l) => '<p>' + esc(l.descricao) + '</p>').join('') + '</div>') : '') +
      grade(doTipo('sugestao'), cardSugestao);
  }

  const MONTADORES = {
    sobre: painelSobre,
    curriculo: painelCurriculo,
    projetos: painelProjetos,
    certificados: painelCertificados,
    sugestoes: painelSugestoes
  };

  function montarMenu() {
    $('menu').innerHTML = ABAS.map((a) =>
      '<button type="button" class="btn menu-item" role="tab" id="aba-' + a.id + '" ' +
      'aria-controls="painel-' + a.id + '" aria-selected="false" tabindex="-1" data-aba="' + a.id + '">' +
      esc(a.rotulo) + '</button>'
    ).join('');
  }

  function montarPaineis() {
    $('conteudo').innerHTML = ABAS.map((a) =>
      '<section class="painel" role="tabpanel" id="painel-' + a.id + '" aria-labelledby="aba-' + a.id + '" tabindex="0" hidden>' +
      MONTADORES[a.id]() + '</section>'
    ).join('');
  }

  /* Planilha e PADRAO passam por aqui: o visual é o mesmo. */
  function montar(linhas) {
    dados = (Array.isArray(linhas) ? linhas : [])
      .filter((linha) => linha && typeof linha === 'object' && visivel(linha))
      .map((linha) => {
        const limpa = {};
        CHAVES.forEach((k) => { limpa[k] = texto(linha[k]).trim(); });
        limpa.tipo = semAcento(limpa.tipo);
        return limpa;
      })
      .filter((linha) => linha.tipo);
    montarLateral();
    montarPaineis();
    mostrarAba(abaDoHash());
  }

  function abaDoHash() {
    let id = location.hash.replace(/^#/, '');
    try { id = decodeURIComponent(id); } catch (e) { /* fragmento malformado: usa o padrão */ }
    return ABAS.some((a) => a.id === id) ? id : 'sobre';
  }

  function mostrarAba(id) {
    ABAS.forEach((a) => {
      const ativa = a.id === id;
      const aba = $('aba-' + a.id);
      const painel = $('painel-' + a.id);
      aba.setAttribute('aria-selected', ativa ? 'true' : 'false');
      aba.tabIndex = ativa ? 0 : -1;
      if (painel) painel.hidden = !ativa;
    });
  }

  function irPara(id, focar) {
    if (location.hash !== '#' + id) location.hash = id;
    mostrarAba(id);
    if (focar) $('aba-' + id).focus();
  }

  function trocarPorIcone(img) {
    const molde = document.createElement('div');
    molde.innerHTML = iconeArquivo(img.getAttribute('data-icone') || 'LINK');
    img.replaceWith(molde.firstChild);
  }

  function ligarEventos() {
    const menu = $('menu');
    menu.addEventListener('click', (ev) => {
      const alvo = ev.target.closest('[role="tab"]');
      if (alvo) irPara(alvo.dataset.aba, false);
    });
    menu.addEventListener('keydown', (ev) => {
      const alvo = ev.target.closest('[role="tab"]');
      if (!alvo) return;
      const atual = ABAS.findIndex((a) => a.id === alvo.dataset.aba);
      let prox = -1;
      switch (ev.key) {
        case 'ArrowDown':
        case 'ArrowRight': prox = (atual + 1) % ABAS.length; break;
        case 'ArrowUp':
        case 'ArrowLeft': prox = (atual - 1 + ABAS.length) % ABAS.length; break;
        case 'Home': prox = 0; break;
        case 'End': prox = ABAS.length - 1; break;
        default: return;
      }
      ev.preventDefault();
      irPara(ABAS[prox].id, true);
    });
    window.addEventListener('hashchange', () => mostrarAba(abaDoHash()));
    /* Miniatura que não carrega vira ícone. */
    document.addEventListener('error', (ev) => {
      const img = ev.target;
      if (img && img.tagName === 'IMG' && img.parentNode && img.parentNode.classList &&
          img.parentNode.classList.contains('miniatura')) {
        trocarPorIcone(img);
      }
    }, true);
  }

  function mostrarStatus(conteudo) {
    if (!new URLSearchParams(location.search).has('status')) return;
    const rodape = $('status');
    rodape.textContent = 'Versão do site: ' + VERSAO + ' · Conteúdo: ' + conteudo;
    rodape.hidden = false;
  }

  function iniciar() {
    desenharMascote();
    montarMenu();
    ligarEventos();
    mostrarAba(abaDoHash());

    const url = texto(PLANILHA_URL).trim();
    if (!url) {
      montar(PADRAO);
      mostrarStatus('dados do próprio arquivo');
      return;
    }
    $('conteudo').innerHTML = '<p class="carregando" role="status">CARREGANDO...</p>';
    carregarPlanilha(url)
      .then((linhas) => {
        montar(linhas);
        mostrarStatus('planilha carregada (' + linhas.length + ' linhas)');
      })
      .catch((erro) => {
        montar(PADRAO);
        const motivo = erro && erro.message ? erro.message : 'erro desconhecido';
        mostrarStatus('planilha indisponível (' + motivo + '), usando dados de reserva');
      });
  }

  iniciar();
})();
</script>
</body>
</html>
