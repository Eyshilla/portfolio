<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio da Eyshilla</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: ficha da personagem + menu à esquerda, caixa de conteúdo NES à direita; no celular tudo empilha */
:root {
  --night: #2a1244;
  --orchid: #a64fd0;
  --orchid-deep: #5e2a8a;
  --pink: #ff9ecf;
  --pink-soft: #ffdaec;
  --pink-deep: #e8579f;
  --lime: #c6f23c;
  --lime-deep: #9bc41f;
  --ink: #2a1244;
  --white: #ffffff;
  --px: 'Press Start 2P', ui-monospace, monospace;
  --body: 'VT323', ui-monospace, monospace;
  --frame: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding-block: 28px 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  font-family: var(--body);
  font-size: 22px;
  line-height: 1.25;
  background-color: var(--pink-soft);
  background-image: radial-gradient(rgba(166,79,208,.16) 2px, transparent 2px);
  background-size: 20px 20px;
  color: var(--ink);
}
h1, h2, h3, p, dl, dd { margin: 0; }
canvas { image-rendering: pixelated; display: block; }
:focus-visible { outline: 3px dashed var(--orchid-deep); outline-offset: 4px; }

.wrap { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 36px 32px; align-items: start; }
.side { display: grid; gap: 32px; min-width: 0; }

/* caixa NES */
.box { position: relative; min-width: 0; background: var(--white); box-shadow: var(--frame); margin: 4px; padding: 22px 20px 18px; }
.box > .ti { position: absolute; top: -17px; left: 12px; background: var(--white); padding: 0 8px; font-family: var(--px); font-size: 10px; line-height: 1.4; color: var(--orchid-deep); }

/* ficha */
.sbox { background: var(--night); padding: 12px; display: inline-block; box-shadow: var(--frame); margin: 4px; }
.name { font-family: var(--px); font-size: 15px; line-height: 1.3; margin: 16px 0 6px; overflow-wrap: anywhere; color: var(--orchid-deep); }
.class { font-size: 22px; margin-bottom: 14px; }
.ficha { display: grid; gap: 10px; }
.ficha div { border-top: 3px dotted var(--orchid); padding-top: 8px; }
.ficha dt { font-family: var(--px); font-size: 8px; line-height: 1.4; color: var(--pink-deep); margin-bottom: 5px; }
.ficha dd { font-size: 21px; }

/* menu */
.menu { display: grid; gap: 14px; }
.mi {
  position: relative; text-align: left; width: 100%; cursor: pointer; border: 0; margin: 0;
  font-family: var(--px); font-size: 11px; line-height: 1.4; color: var(--ink);
  padding: 14px 12px 14px 32px; background: var(--pink);
  box-shadow: var(--frame), inset -4px -4px 0 0 var(--pink-deep);
}
.mi:hover { filter: brightness(1.06); }
.mi:active { transform: translateY(3px); }
.mi[aria-selected="true"] { background: var(--lime); box-shadow: var(--frame), inset -4px -4px 0 0 var(--lime-deep); }
.mi[aria-selected="true"]::before { content: ""; position: absolute; left: 11px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 9px solid var(--ink); border-right: 0; }

/* conteúdo */
.main { display: grid; gap: 40px; }
.main h2 { font-family: var(--px); font-size: 14px; line-height: 1.5; color: var(--orchid-deep); margin-bottom: 14px; }
.main p + p { margin-top: 12px; }
.lead { font-size: 26px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 40px 26px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
li { padding-left: 24px; position: relative; }
li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 10px; height: 10px; background: var(--orchid); box-shadow: 3px 3px 0 var(--pink); }
li b { display: block; font-weight: 400; }
li span { color: var(--orchid-deep); font-size: 20px; }
.tag { display: inline-block; font-family: var(--px); font-size: 8px; line-height: 1.4; padding: 6px 7px; margin: 0 8px 8px 2px; background: var(--lime); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.box h3 { font-family: var(--px); font-size: 11px; line-height: 1.5; color: var(--orchid-deep); margin-bottom: 10px; }
.sec { font-family: var(--px); font-size: 11px; line-height: 1.4; display: inline-block; background: var(--pink); padding: 9px 11px; margin-bottom: 30px; box-shadow: 4px 4px 0 var(--ink); }
.quest small { display: block; font-family: var(--px); font-size: 8px; color: var(--pink-deep); margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 16px; margin-top: 20px; }
.stat { background: var(--pink-soft); padding: 10px 12px; box-shadow: 0 0 0 3px var(--ink); }
.stat small { display: block; font-family: var(--px); font-size: 8px; color: var(--orchid-deep); margin-bottom: 7px; }
.hint { font-size: 20px; opacity: .8; max-width: 60ch; }

.lnk { display: inline-block; margin: 4px 8px 4px 2px; padding: 10px 12px; font-family: var(--px); font-size: 9px; line-height: 1.4; color: var(--ink); background: var(--pink); text-decoration: none; box-shadow: var(--frame); }
a.lnk:hover { background: var(--lime); }
.lnk.empty { background: transparent; box-shadow: none; border: 3px dashed var(--orchid); color: var(--orchid-deep); }
.contatos { display: grid; gap: 6px; }
@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .menu { grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
}
</style>

<div class="wrap">
  <aside class="side">
    <div class="box">
      <span class="ti">Jogadora 1</span>
      <div class="sbox"><canvas id="spr" aria-hidden="true"></canvas></div>
      <p class="name">EYSHILLA</p>
      <p class="class">Classe: estudante de Negócios e Produção</p>
      <dl class="ficha">
        <div><dt>MISSÃO ATUAL</dt><dd>Business Intelligence</dd></div>
        <div><dt>GUILDA</dt><dd>Rock Encantech (estágio)</dd></div>
        <div><dt>FASE</dt><dd>4º semestre · dez/2028</dd></div>
      </dl>
    </div>
    <nav class="menu" role="tablist" aria-label="Menu do portfólio">
      <button class="mi" role="tab" id="t-sobre" data-tab="sobre">SOBRE MIM</button>
      <button class="mi" role="tab" id="t-curriculo" data-tab="curriculo">CURRÍCULO</button>
      <button class="mi" role="tab" id="t-projetos" data-tab="projetos">PROJETINHOS</button>
    </nav>
    <div class="box" id="contatos" hidden></div>
  </aside>
  <main class="main" id="main" role="tabpanel" aria-live="polite"></main>
</div>

<script>
const D = {
  sobre: [
    'Oi! Eu sou a Eyshilla. Estudo Negócios e Produção na UNIVESP (4º semestre) e faço estágio em Planejamento e OKRs na Rock Encantech. Quero trabalhar com Business Intelligence: transformar dados e processos em decisões melhores.',
    'Participo do Sebrae Supernova e ajudei a fundar um clube de pesquisa científica na minha faculdade, que levou a instituição a lançar um programa de iniciação científica.'
  ],
  stats: [['SEMESTRE', '4º na UNIVESP'], ['FORMATURA', 'dez/2028'], ['FOCO', 'Business Intelligence']],
  cv: [
    { h: 'Formação', items: [
      { t: 'Negócios e Produção', s: 'UNIVESP · 4º semestre · formatura prevista em dez/2028' },
      { t: 'Engenharia de Produção', s: 'Em curso' },
      { t: 'Tecnologia em Processos de Produção', s: 'Formação tecnológica' } ] },
    { h: 'Experiência', items: [
      { t: 'Estágio em Planejamento e OKRs', s: 'Rock Encantech · presencial 2x por semana · desde abr/2025' } ] },
    { h: 'Programas e iniciativas', items: [
      { t: 'Sebrae Supernova', s: 'Programa de empreendedorismo' },
      { t: 'Instituto Bold', s: 'Programa com vídeo-depoimento sobre impacto na trajetória' },
      { t: 'Clube de pesquisa científica', s: 'Ajudei a fundar; gerou o programa de iniciação científica da faculdade' } ] },
    { h: 'Ferramentas e temas', chips: ['Google Sheets', 'Apps Script', 'Análise de dados', 'OKRs', 'Mapeamento de processos', 'Business Intelligence'] }
  ],
  analises: [
    { t: 'Avaliações da Pribox Esquadrias', d: 'Proposta de melhoria para uma empresa de esquadrias de alumínio, baseada em avaliações públicas de clientes, com foco nas negativas.', tags: ['Análise de avaliações', 'Proposta'], link: '' },
    { t: 'Trilha de análise de dados', d: 'Roadmap de estudo estruturado para desenvolver as habilidades de análise de dados rumo a BI.', tags: ['Estudo', 'BI'], link: '' }
  ],
  cursos: [
    { t: 'Projeto Integrador: esquadrias', d: 'Mapeamento dos processos de vendas e pós-venda de uma empresa de esquadrias, feito na UNIVESP.', tags: ['Processos', 'UNIVESP'], link: '' },
    { t: 'Ferramenta Realizados', d: 'Barra lateral em Google Apps Script para a planilha de registros do grupo do projeto integrador.', tags: ['Apps Script', 'Sheets'], link: '' }
  ]
};
const NOTE = 'Textos de exemplo montados a partir do que você contou. Troque pelos seus antes de publicar.';
const tags = a => a.map(t => `<span class="tag">${t}</span>`).join('');
/* LINKS: cole o endereço entre as aspas de "link" em cada projeto (acima) e em CONTATOS (abaixo).
   Enquanto SHOW_SLOTS for true, os espaços vazios aparecem tracejados. Troque para false quando terminar. */
const SHOW_SLOTS = true;
const CONTATOS = [
  { label: 'GITHUB', url: '' },
  { label: 'LINKEDIN', url: '' },
  { label: 'E-MAIL', url: '' }
];
const slot = (url, label) => url
  ? `<a class="lnk" href="${url}" target="_blank" rel="noopener">${label} ▶</a>`
  : (SHOW_SLOTS ? `<span class="lnk empty">${label}: colar link aqui</span>` : '');
const proj = (list, label) => list.map(p => `<div class="box quest"><small>${label}</small><h3>${p.t}</h3><p>${p.d}</p><div style="margin-top:14px">${tags(p.tags)}</div><div style="margin-top:6px">${slot(p.link, 'VER NO GITHUB')}</div></div>`).join('');
function renderContatos() {
  const el = document.getElementById('contatos');
  const html = CONTATOS.map(c => slot(c.url, c.label)).join('');
  if (!html) return;
  el.innerHTML = `<span class="ti">Contatos</span><div class="contatos">${html}</div>`;
  el.hidden = false;
}

const VIEWS = {
  sobre: () => `
    <div class="box"><span class="ti">Sobre mim</span>
      <p class="lead">${D.sobre[0]}</p><p>${D.sobre[1]}</p>
      <div class="stats">${D.stats.map(s => `<div class="stat"><small>${s[0]}</small>${s[1]}</div>`).join('')}</div>
    </div>
    <p class="hint">${NOTE}</p>`,
  curriculo: () => `
    <div><span class="sec">CURRÍCULO</span>
      <div class="cols">${D.cv.map(b => `<div class="box"><span class="ti">${b.h}</span>${b.items
        ? `<ul>${b.items.map(i => `<li><b>${i.t}</b><span>${i.s}</span></li>`).join('')}</ul>`
        : `<div>${tags(b.chips)}</div>`}</div>`).join('')}</div>
    </div>
    <p class="hint">${NOTE}</p>`,
  projetos: () => `
    <div><span class="sec">ANÁLISES</span><div class="cols">${proj(D.analises, 'MISSÃO DE ANÁLISE')}</div></div>
    <div><span class="sec">PROJETOS DE CURSOS</span><div class="cols">${proj(D.cursos, 'MISSÃO DE CURSO')}</div></div>
    <p class="hint">${NOTE}</p>`
};

const SPR = ['.....LL.....','....LLLL....','....LLLL....','...PPPPPP...','..PHHPPPPP..','.PHHPPPPPPP.','.PHPPPPPPPP.','.PPPPPPPPPP.','PPPPPPPPPPPP','PP.PPPPP.PP.','.OOOOOOOOOO.','..ODODODOD..','..DODODODO..','...ODODOD...','....DODO....','.....OO.....'];
const PAL = { P: '#ff9ecf', H: '#ffe3f1', L: '#c6f23c', O: '#a64fd0', D: '#5e2a8a' };
(function () {
  const c = document.getElementById('spr'), s = 8;
  c.width = 12 * s; c.height = 16 * s;
  const x = c.getContext('2d');
  SPR.forEach((row, y) => [...row].forEach((ch, i) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i * s, y * s, s, s); } }));
  c.style.width = (12 * s) + 'px'; c.style.maxWidth = '100%'; c.style.height = 'auto';
})();

renderContatos();
const main = document.getElementById('main');
function show(tab) {
  if (!VIEWS[tab]) tab = 'sobre';
  main.innerHTML = VIEWS[tab]();
  main.setAttribute('aria-labelledby', 't-' + tab);
  document.querySelectorAll('.mi').forEach(b => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  });
}
const fromHash = () => location.hash.replace('#', '');
document.querySelectorAll('.mi').forEach(b => {
  b.addEventListener('click', () => { location.hash = b.dataset.tab; });
  b.addEventListener('keydown', e => {
    const tabs = [...document.querySelectorAll('.mi')], i = tabs.indexOf(b);
    const k = e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 0;
    if (!k) return;
    e.preventDefault();
    const n = tabs[(i + k + tabs.length) % tabs.length];
    n.focus(); location.hash = n.dataset.tab;
  });
});
window.addEventListener('hashchange', () => show(fromHash()));
show(fromHash());
</script>

</html>
